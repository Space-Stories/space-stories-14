- type: entity
  id: STActionHereticKnitFlesh
  name: Knit Flesh
  description: Touch one of your servants to mend their wounds. Works only on your own ghouls and summons.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 20
  - type: Sprite
    sprite: _Stories/Heretic/actions.rsi
    layers:
    - state: mad_touch
  - type: TargetAction
    range: 1.5
    interactOnMiss: false
  - type: EntityTargetAction
    event: !type:StoriesHereticKnitFleshEvent
    canTargetSelf: false
    whitelist:
      components:
      - MobState
  - type: StoriesHereticRequiresFocus

- type: entity
  id: STActionHereticShedForm
  name: Shed Form
  description: Shed your fragile form and become the Lord of the Night. Revert with the polymorph action.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 10
    checkCanInteract: false
  - type: Sprite
    sprite: _Stories/Heretic/actions.rsi
    layers:
    - state: worm_ascend
  - type: InstantAction
    event: !type:StoriesHereticShedFormEvent

# Действия Сырого пророка: без StoriesHereticRequiresFocus, моб не еретик.
- type: entity
  id: STActionHereticRawProphetJaunt
  name: Ethereal Jaunt
  description: Dissolve into ash for a moment and pass through walls. Twice as long as the heretic's passage.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 15
    checkCanInteract: false
  - type: Sprite
    sprite: _Stories/Heretic/actions.rsi
    layers:
    - state: ash_shift
  - type: InstantAction
    event: !type:PolymorphActionEvent
      protoId: STHereticAshJauntLong

- type: entity
  id: STActionHereticRawProphetBlind
  name: Blinding
  description: Strike a creature within sight blind for 10 seconds.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 20
  - type: Sprite
    sprite: _Stories/Heretic/actions.rsi
    layers:
    - state: eye
  - type: TargetAction
    range: 10
  - type: EntityTargetAction
    event: !type:StoriesHereticEldritchBlindEvent
      duration: 10
    canTargetSelf: false
    whitelist:
      components:
      - MobState

# Действия Сталкера: без StoriesHereticRequiresFocus, моб не еретик.
- type: entity
  id: STActionHereticStalkerEmp
  name: Eldritch EMP
  description: Release an electromagnetic pulse that disables electronics around you.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 30
    checkCanInteract: false
  - type: Sprite
    sprite: _Stories/Heretic/actions.rsi
    layers:
    - state: shatter
  - type: InstantAction
    event: !type:StoriesHereticEldritchEmpEvent
      range: 6
      energy: 50000
      duration: 15

- type: entity
  id: STActionHereticStalkerJaunt
  name: Ethereal Jaunt
  description: Dissolve into ash for a moment and pass through walls.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 15
    checkCanInteract: false
  - type: Sprite
    sprite: _Stories/Heretic/actions.rsi
    layers:
    - state: voidblink
  - type: InstantAction
    event: !type:PolymorphActionEvent
      protoId: STHereticAshJauntLong

- type: entity
  id: STActionHereticStalkerShapeshift
  name: Shapeshift
  description: Choose a lesser form once, then take it whenever you wish.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 5
    checkCanInteract: false
  - type: Sprite
    sprite: _Stories/Heretic/actions.rsi
    layers:
    - state: blood_siphon
  - type: InstantAction
    event: !type:StoriesHereticStalkerShapeshiftEvent
