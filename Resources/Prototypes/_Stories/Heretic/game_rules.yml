- type: entity
  parent: BaseGameRule
  id: STHeretic
  components:
  - type: GameRule
    minPlayers: 30
  - type: StoriesHereticRule
    shadowRealmMap: /Maps/_Stories/Nonstations/heretic_shadow_realm.yml
  - type: AntagObjectives
    objectives:
    - STHereticObjectiveKnowledge
    - STHereticObjectiveSacrifice
    - STHereticObjectiveHeadSacrifice
  - type: AntagSelection
    agentName: stories-heretic-round-end-agent-name
    antags:
    - !type:LinearAntagCount
      proto: STHereticSpecifier
      playerRatio: 24
      range:
        min: 1
        max: 3

- type: gamePreset
  id: STHeretic
  alias:
  - heretic
  name: stories-heretic-title
  description: stories-heretic-description
  showInVote: true
  rules:
  - STHeretic
  - SubGamemodesRule
  - CalmStationEventScheduler
  - MeteorSwarmScheduler
  - BasicRoundstartVariation
