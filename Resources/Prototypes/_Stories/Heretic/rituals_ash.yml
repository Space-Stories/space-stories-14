- type: entity
  parent: STHereticRitualBase
  id: STHereticRitualAshBlade
  name: Ashen Blade
  description: A knife and a match or lighter.
  components:
  - type: StoriesHereticRitual
    limit: 3
    ingredients:
    - name: stories-heretic-ingredient-knife
      whitelist:
        tags: [ Knife ]
    - name: stories-heretic-ingredient-fire
      whitelist:
        tags: [ Matchstick ]
      prototypes: [ Lighter, CheapLighter ]
    results:
    - STHereticBladeAsh

- type: entity
  parent: STHereticRitualBase
  id: STHereticRitualAshenEyes
  name: Ashen Eyes
  description: A glass shard, a candle and a pair of eyes.
  components:
  - type: StoriesHereticRitual
    ingredients:
    - name: stories-heretic-ingredient-glass-shard
      whitelist:
        tags: [ GlassShard ]
    - name: stories-heretic-ingredient-candle
      whitelist:
        tags: [ Candle ]
    - name: stories-heretic-ingredient-eyes
      organCategory: Eyes
    results:
    - STHereticAshenEyes

- type: entity
  parent: STHereticRitualBase
  id: STHereticRitualMadnessMask
  name: Mask of Madness
  description: A breath, gas or sterile mask, four candles, a stun baton and a liver.
  components:
  - type: StoriesHereticRitual
    ingredients:
    - name: stories-heretic-ingredient-mask
      prototypes: [ ClothingMaskGas, ClothingMaskBreath, ClothingMaskSterile ]
    - name: stories-heretic-ingredient-candle
      amount: 4
      whitelist:
        tags: [ Candle ]
    - name: stories-heretic-ingredient-stunbaton
      prototypes: [ Stunbaton ]
    - name: stories-heretic-ingredient-liver
      organCategory: Liver
    results:
    - STHereticMadnessMask

- type: entity
  parent: STHereticRitualBase
  id: STHereticRitualAshAscension
  name: "Ashlord's Rite"
  description: Three corpses that are burning or badly burnt.
  components:
  - type: StoriesHereticRitual
    effect: Ascension
  - type: StoriesHereticAshAscensionRitual
    actions:
    - STActionHereticFireRing
    - STActionHereticFireWave
    cooldownMultipliers:
      STActionHereticVolcanoBlast: 0.66
      STActionHereticRebirth: 0.16
    addComponents:
    - type: ExplosionResistance
      damageCoefficient: 0
      worn: false

- type: entity
  parent: STHereticRitualBase
  id: STHereticRitualAshMantle
  name: Scorched Mantle
  description: A table or any outer clothing, any mask and a match or lighter.
  components:
  - type: StoriesHereticRitual
    ingredients:
    - name: stories-heretic-ingredient-table-or-suit
      whitelist:
        components: [ Bonkable ]
      clothingSlots: OUTERCLOTHING
    - name: stories-heretic-ingredient-any-mask
      clothingSlots: MASK
    - name: stories-heretic-ingredient-fire
      whitelist:
        tags: [ Matchstick ]
      prototypes: [ Lighter, CheapLighter ]
    results:
    - STHereticScorchedMantle
