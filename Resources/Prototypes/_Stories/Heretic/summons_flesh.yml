# Общий набор сопротивлений призывов Плоти.
- type: damageModifierSet
  id: STHereticSummonDamageModifierSet
  coefficients:
    Blunt: 0.7
    Slash: 0.7
    Piercing: 0.7
    Heat: 0.7
    Cold: 0.7
    Shock: 0.7
    Poison: 0
    Asphyxiation: 0

- type: entity
  id: STHereticMobRawProphet
  parent:
  - BaseSimpleMob
  - MobCombat
  - STHereticSummonBase
  name: Raw Prophet
  description: An abomination stitched together from several severed arms and one swollen, orphaned eye.
  components:
  - type: Sprite
    sprite: _Stories/Heretic/raw_prophet.rsi
    layers:
    - state: icon
  - type: Damageable
    damageModifierSet: STHereticSummonDamageModifierSet
  - type: MobThresholds
    thresholds:
      0: Alive
      65: Dead
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 7
  - type: StoriesHereticFocusedAttack
    bonus: 2
    maxBonus: 10
  - type: VisionProvider
    isActive: true
    thermalVision: true
    ambientColor: "#FFFFFF10"
    priority: 5
  - type: ActionGrant
    actions:
    - STActionHereticRawProphetJaunt
    - STActionHereticRawProphetBlind
    - STActionHereticRawProphetMansusLink
    - STActionHereticRawProphetExpandSight
  - type: StoriesHereticRawProphet
  - type: GhostRole
    name: stories-heretic-ghost-role-raw-prophet-name
    description: stories-heretic-ghost-role-raw-prophet-desc
  - type: Tag
    tags:
    - CannotSuicide
    - DoorBumpOpener

- type: entity
  id: STActionHereticRawProphetMansusLink
  name: Mansus Link
  description: Bind a creature to a private telepathic channel. Mindshielded and holy targets resist. If the prophet dies, every linked mind screams and is stunned.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 20
  - type: Sprite
    sprite: _Stories/Heretic/actions.rsi
    layers:
    - state: mansus_link
  - type: TargetAction
    range: 7
  - type: EntityTargetAction
    event: !type:StoriesHereticMansusLinkEvent
      duration: 6
      range: 7
    canTargetSelf: false
    whitelist:
      components:
      - MobState

- type: entity
  id: STActionHereticRawProphetExpandSight
  name: Expand Sight
  description: Widen your view. Use again to return to normal sight.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 8
    checkCanInteract: false
  - type: Sprite
    sprite: _Stories/Heretic/actions.rsi
    layers:
    - state: eye
  - type: InstantAction
    event: !type:StoriesHereticExpandSightEvent
      zoom: 1.5

- type: entity
  id: STHereticMobStalker
  parent:
  - BaseSimpleMob
  - MobCombat
  - STHereticSummonBase
  name: Stalker
  description: An abomination assembled from assorted remains. Its shape shifts a little every time you blink.
  components:
  - type: Sprite
    sprite: _Stories/Heretic/stalker.rsi
    layers:
    - state: icon
  - type: Damageable
    damageModifierSet: STHereticSummonDamageModifierSet
  - type: MobThresholds
    thresholds:
      0: Alive
      150: Dead
  - type: MeleeWeapon
    damage:
      types:
        Slash: 17
  - type: VisionProvider
    isActive: true
    thermalVision: true
    ambientColor: "#FFFFFF10"
    priority: 5
  - type: ActionGrant
    actions:
    - STActionHereticStalkerEmp
    - STActionHereticStalkerJaunt
    - STActionHereticStalkerShapeshift
  - type: StoriesHereticStalkerForm
    forms:
    - polymorph: STHereticStalkerFormCat
      mob: MobCat
      name: stories-heretic-stalker-form-cat
    - polymorph: STHereticStalkerFormCorgi
      mob: MobCorgi
      name: stories-heretic-stalker-form-corgi
    - polymorph: STHereticStalkerFormMouse
      mob: MobMouse
      name: stories-heretic-stalker-form-mouse
    - polymorph: STHereticStalkerFormFox
      mob: MobFox
      name: stories-heretic-stalker-form-fox
    - polymorph: STHereticStalkerFormCarp
      mob: MobCarp
      name: stories-heretic-stalker-form-carp
  - type: UserInterface
    interfaces:
      enum.StoriesHereticStalkerFormUiKey.Key:
        type: StoriesHereticStalkerFormBoundUserInterface
  - type: GhostRole
    name: stories-heretic-ghost-role-stalker-name
    description: stories-heretic-ghost-role-stalker-desc
  - type: Tag
    tags:
    - CannotSuicide
    - DoorBumpOpener

# Облики Сталкера: штатный возврат даёт действие полиморфа (forced: false).
- type: polymorph
  id: STHereticStalkerFormCat
  configuration:
    entity: MobCat
    transferName: true
    inventory: None
    forced: false
    transferDamage: true
    revertOnDeath: true
    allowRepeatedMorphs: true
    delay: 5

