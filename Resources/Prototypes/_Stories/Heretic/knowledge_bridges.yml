    bridge: [ STHereticPathFlesh, STHereticPathVoid ]
    stage: 3
    requires: [ STHereticKnowledgeFleshImperfect, STHereticKnowledgeVoidAristocrat ]
    rituals:
    - STHereticRitualVoidCloak
