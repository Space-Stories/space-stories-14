- type: entity
  parent: BaseKnife
  id: STHereticBladeAsh
  name: ashen blade
  description: A curved blade that smells of smoke. Breaking it carries you away through the Mansus.
  components:
  - type: StoriesHereticBlade
    breakMessage: stories-heretic-blade-break-ash
  - type: Sprite
    sprite: _Stories/Heretic/ash_blade.rsi
    state: icon
  - type: Item
    sprite: _Stories/Heretic/ash_blade_inhand.rsi
    size: Normal
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 1.2
    damage:
      types:
        Slash: 17
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg

- type: entity
  parent: ClothingNeckBase
  id: STHereticAshenEyes
  name: warm eldritch medallion
  description: A smouldering medallion with an eye. Through it you see the warmth of the living.
  components:
  - type: Sprite
    sprite: _Stories/Heretic/ashen_eyes.rsi
    state: icon
  - type: Clothing
    sprite: _Stories/Heretic/ashen_eyes.rsi
  - type: StoriesHereticFocus
  - type: VisionProvider
    isActive: true
    thermalVision: true
    ambientColor: "#FFFFFF10"
    priority: 5

- type: entity
  parent: ClothingMaskGas
  id: STHereticMadnessMask
  name: mask of madness
  description: A grinning mask. Those who see it lose their minds.
  components:
  - type: StoriesHereticMadnessMask
  - type: Sprite
    sprite: _Stories/Heretic/madness_mask.rsi
    state: icon
  - type: Clothing
    sprite: _Stories/Heretic/madness_mask.rsi

- type: entity
  id: STHereticFireRingEffect
  name: ring of fire
  description: A smouldering ring of ashen fire.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Stories/Heretic/fire_ring.rsi
    color: "#ff7a22dd"
    layers:
    - state: ring
      shader: unshaded
    drawdepth: FloorObjects
    noRot: true
  - type: PointLight
    radius: 3.5
    energy: 0.8
    softness: 2
    color: "#ff7a22"
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  id: STHereticFireEffect
  name: eldritch flame
  description: Ashen fire.
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 0.6
  - type: Sprite
    sprite: _Stories/Heretic/effects.rsi
    layers:
    - state: flame
      shader: unshaded
    drawdepth: Effects
  - type: Tag
    tags:
    - HideContextMenu
