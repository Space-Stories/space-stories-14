- type: entity
  parent: STHereticRitualBase
  id: STHereticRitualFleshBlade
  name: Bloody Blade
  description: A knife and a pool of blood.
  components:
  - type: StoriesHereticRitual
    limit: 4
    ascendedUnlimited: true
    ingredients:
    - name: stories-heretic-ingredient-knife
      whitelist:
        tags: [ Knife ]
      blacklist:
        components: [ StoriesHereticBlade ]
    - name: stories-heretic-ingredient-blood
      reagents: [ Blood, InsectBlood, CopperBlood, AmmoniaBlood, Slime ]
    results:
    - STHereticBladeFlesh

- type: entity
  parent: STHereticRitualBase
  id: STHereticRitualFleshImperfect
  name: Imperfect Ritual
  description: A poppy and a corpse on the rune. Raises the corpse as a mute ghoul; without a soul, a ghost may claim it.
  components:
  - type: StoriesHereticRitual
    effect: Ghoul
    ingredients:
    - name: stories-heretic-ingredient-poppy
      prototypes: [ FoodPoppy ]
  - type: StoriesHereticGhoulRitual
    conversion: STHereticGhoulVoiceless
    limit: 2
    ascendedBonus: 4

- type: entity
  parent: STHereticRitualBase
  id: STHereticRitualRawProphet
  name: Raw Ritual
  description: A pair of eyes, a left arm and a pool of blood. Summons the Raw Prophet.
  components:
  - type: StoriesHereticRitual
    effect: Summon
    ingredients:
    - name: stories-heretic-ingredient-eyes
      organCategory: Eyes
    - name: stories-heretic-ingredient-arm
      organCategory: ArmLeft
    - name: stories-heretic-ingredient-blood
      reagents: [ Blood, InsectBlood, CopperBlood, AmmoniaBlood, Slime ]
  - type: StoriesHereticSummonRitual
    mob: STHereticMobRawProphet

- type: entity
  parent: STHereticRitualBase
  id: STHereticRitualStalker
  name: Lonely Ritual
  description: Three slabs of meat, a pen and a sheet of paper. Summons the Stalker.
  components:
  - type: StoriesHereticRitual
    effect: Summon
    ingredients:
    - name: stories-heretic-ingredient-meat
      amount: 3
      whitelist:
        tags: [ Meat ]
    - name: stories-heretic-ingredient-pen
      whitelist:
        tags: [ Write ]
    - name: stories-heretic-ingredient-paper
      whitelist:
        tags: [ Paper ]
  - type: StoriesHereticSummonRitual
    mob: STHereticMobStalker

- type: entity
  parent: STHereticRitualBase
  id: STHereticRitualFleshAscension
  name: Priest's Final Hymn
  description: Four humanoid corpses on the rune.
  components:
  - type: StoriesHereticRitual
    effect: Ascension
  - type: StoriesHereticFleshAscensionRitual
    actions:
    - STActionHereticShedForm
