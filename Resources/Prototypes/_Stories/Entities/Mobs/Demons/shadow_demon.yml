- type: entity
  id: STMobShadowDemon
  parent:
  - BaseSimpleMob
  - MobCombat
  name: shadow demon
  description: A creature that is barely perceptible. You can feel its gaze piercing through you.
  components:
  - type: Sprite
    sprite: _Stories/Mobs/Demons/shadow_demon.rsi
    layers:
    - state: shadow_demon
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 4.5
  - type: Damageable
    damageModifierSet: STShadowDemonDamageModifierSet
  - type: TemperatureDamage
    coldDamageThreshold: -10000
  - type: MobThresholds
    thresholds:
      0: Alive
      180: Dead
  - type: MeleeWeapon
    altDisarm: false
    range: 1.5
    angle: 0
    animation: WeaponArcThrust
    wideAnimation: WeaponArcThrust
    soundHit:
      collection: STShadowDemonAttack
    damage:
      types:
        Slash: 30
  - type: NpcFactionMember
    factions:
    - STDemon
  - type: DemonDeathSound
    sound:
      path: /Audio/_Stories/Demons/ShadowDemon/shadowdeath.ogg
  - type: DemonImmunities
  - type: StaminaResistance
    worn: false
    damageCoefficient: 0
  - type: Language
    currentLanguage: Demonic
    defaultLanguage: Demonic
    spokenLanguages:
    - Demonic
    understoodLanguages:
    - Demonic
    - GalacticCommon
  - type: NoSlip
  - type: Puller
    needsHands: false
  - type: Hands
  - type: Eye
    drawFov: false
    visMask:
    - Normal
    - Ghost
  - type: Photosensitivity
    damage:
      types:
        Heat: 15
    damageInSpace: null
    darknessHealing:
      types:
        Blunt: -30
        Slash: -30
        Piercing: -30
        Heat: -30
    lightAlert: STLightExposure
    darkSpeedMultiplier: 1.5
    lightSpeedMultiplier: 0.6
    flashDamage:
      types:
        Heat: 50
    meleeFlashDamage:
      types:
        Heat: 80
  - type: DemonPhase
    anchor: Darkness
    phasePolymorph: STPolymorphShadowDemonPhase
    failPopup: shadow-demon-phase-fail
    phaseOutEffect: STShadowDemonDisappearEffect
    phaseInEffect: STShadowDemonAppearEffect
  - type: ShadowGrapple
    hitDamage:
      types:
        Blunt: 40
  - type: DemonWrap
    cocoonPrototype: STStructureShadowCocoon
  - type: DemonSpawnPhased
  - type: DemonWhisper
  - type: MobStateActions
    actions:
      Alive:
      - STActionShadowCrawl
      - STActionShadowGrapple
      - STActionDemonWhisper
  - type: GhostRole
    name: stories-ghost-role-information-shadow-demon-name
    description: stories-ghost-role-information-shadow-demon-desc
    rules: stories-ghost-role-information-demon-rules
    mindRoles:
    - STMindRoleShadowDemon
    raffle:
      settings: default
  - type: GhostTakeoverAvailable
  - type: Tag
    tags:
    - CannotSuicide
    - DoorBumpOpener
    - StunImmune

- type: entity
  id: STMobShadowDemonPhased
  categories: [ HideSpawnMenu ]
  name: dark clump
  description: Something immaterial, dissolved into darkness.
  parent:
  - Incorporeal
  - BaseMob
  components:
  - type: Sprite
    sprite: _Stories/Mobs/Demons/shadow_demon.rsi
    color: "#3A2A5AAA"
    layers:
    - state: shadow_demon
      shader: unshaded
  - type: Damageable
    damageModifierSet: STShadowDemonDamageModifierSet
  - type: Injurable
    damageContainer: Biological
  - type: Alerts
  - type: MobState
    allowedStates:
    - Alive
    - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      180: Dead
  - type: Photosensitivity
    damage:
      types:
        Heat: 7.5
    damageInSpace: null
    darknessHealing:
      types:
        Blunt: -30
        Slash: -30
        Piercing: -30
        Heat: -30
    lightAlert: STLightExposure
  - type: MovementSpeedModifier
    baseWalkSpeed: 5
    baseSprintSpeed: 7
  - type: Eye
    drawFov: false
    visMask:
    - Normal
    - Ghost
  - type: Visibility
    layer: 2
  - type: Language
    currentLanguage: Demonic
    defaultLanguage: Demonic
    spokenLanguages:
    - Demonic
    understoodLanguages:
    - Demonic
    - GalacticCommon
  - type: VisionProvider
    isActive: true
    drawFov: false
    ambientColor: "#FFFFFF10"
    shader: GreyscaleFullscreen
    priority: 10
  - type: DemonPhase
    anchor: Darkness
    phasePolymorph: STPolymorphShadowDemonPhase
    failPopup: shadow-demon-phase-fail
    phaseOutEffect: STShadowDemonDisappearEffect
    phaseInEffect: STShadowDemonAppearEffect
  - type: DemonWhisper
  - type: MobStateActions
    actions:
      Alive:
      - STActionShadowCrawl
      - STActionDemonWhisper
  - type: Tag
    tags:
    - CannotSuicide
    - StunImmune

- type: polymorph
  id: STPolymorphShadowDemonPhase
  configuration:
    entity: STMobShadowDemonPhased
    forced: true
    inventory: Drop
    allowRepeatedMorphs: true
    transferDamage: true
    transferName: false
    revertOnCrit: false
    revertOnDeath: true
