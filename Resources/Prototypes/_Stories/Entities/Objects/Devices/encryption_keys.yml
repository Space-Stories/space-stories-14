- type: entity
  parent: EncryptionKey
  id: STEncryptionKeyIAA
  name: internal Affairs encryption key
  description: The encryption key used by the most meticulous person on the station.
  components:
    - type: EncryptionKey
      channels:
        - Common
        - Command
        - Security
        - STJuridical
      defaultChannel: Command
    - type: Sprite
      sprite: _Stories/Objects/Devices/encryption_keys.rsi
      layers:
        - state: crypt_silver
        - state: nano_label

- type: entity
  parent: EncryptionKey
  id: STPRISONEncryptionKey
  name: prison encryption key
  description: An encryption key used by space prison staff.
  components:
    - type: EncryptionKey
      channels:
        - Prison
      defaultChannel: Prison
    - type: Sprite
      sprite: _Stories/Objects/Devices/encryption_keys.rsi
      layers:
        - state: crypt_prison
        - state: prison_label

- type: entity
  parent: EncryptionKey
  id: STEncryptionKeyJuridical
  name: juridical encryption key
  description: Encryption key used by the legal department.
  components:
  - type: EncryptionKey
    channels:
    - STJuridical
    defaultChannel: STJuridical
  - type: Sprite
    sprite: _Stories/Objects/Devices/encryption_keys.rsi
    layers:
    - state: crypt_silver
    - state: court_label
  - type: Tag
    tags:
    - STEncryptionJuridical

- type: entity
  parent: EncryptionKey
  id: STEncryptionKeyBlueshield
