- type: entity
  parent: BaseWeaponRevolver
  id: STWeaponRevolverTakbokBlueshield
  name: unmarked takbok revolver
  description: A modified revolver resembling that of Trappiste's signature Takbok, notably lacking any of the company's original markings or traceable identification. The custom modifications allow it to shoot the five .585 Trappiste rounds in its cylinder quicker and with more consistency.
  components:
  - type: Sprite
    sprite: _Stories/Objects/Weapons/Guns/Revolvers/takbok.rsi
    layers:
    - state: takbok_blueshield
  - type: Clothing
    sprite: _Stories/Objects/Weapons/Guns/Revolvers/takbok.rsi
  - type: Gun
    fireRate: 1.67
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/revolver.ogg
  - type: RevolverAmmoProvider
    proto: STCartridge585Trappiste
    capacity: 5
    chambers: [ True, True, True, True, True ]
    ammoSlots: [ null, null, null, null, null ]
    whitelist:
      tags:
      - STCartridge585Trappiste
      - STSpeedLoader585Trappiste

- type: entity
  parent: BaseWeaponSubMachineGun
  id: STWeaponSubmachineGunBogseo
  name: Bogseo heavy submachine gun
  description: A weapon that could hardly be called a 'sub' machinegun, firing the hefty .585 cartridge. It provides enough kick to bruise a shoulder pretty bad if used without protection.
  components:
  - type: Sprite
    sprite: _Stories/Objects/Weapons/Guns/SubmachineGuns/bogseo.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: Appearance
  - type: Clothing
    sprite: _Stories/Objects/Weapons/Guns/SubmachineGuns/bogseo.rsi
  - type: Gun
    fireRate: 3.33
    selectedMode: FullAuto
    availableModes:
    - SemiAuto
    - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/smg.ogg
  - type: Wieldable
    unwieldOnUse: false
  - type: GunRequiresWield
  - type: GunWieldBonus
    minAngle: -10
    maxAngle: -10
  - type: ItemSlots
    slots:
      gun_magazine:
        startingItem: STMagazine585TrappistePistol
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
        priority: 2
        whitelist:
          tags:
          - STMagazine585Trappiste
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        priority: 1
        whitelist:
          tags:
          - STCartridge585Trappiste

- type: entity
  parent: BaseWeaponBattery
  id: STWeaponLaserHellfireBlueshield
  name: modified hellfire laser gun
  description: A lightly overtuned version of NT's Hellfire Laser rifle, scratches showing its age and the fact it has definitely been owned before. This one is more energy efficient without sacrificing damage.
  components:
  - type: Sprite
    sprite: _Stories/Objects/Weapons/Guns/Laser/hellgun.rsi
    layers:
    - state: hellgun
  - type: Clothing
    sprite: _Stories/Objects/Weapons/Guns/Laser/hellgun.rsi
  - type: Gun
    fireRate: 2.0
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser_cannon.ogg
  - type: BatteryAmmoProvider
    proto: STProjectileLaserHellfire
    fireCost: 100
  - type: Battery
    maxCharge: 1300
    startingCharge: 1300
  - type: MagazineVisuals
    magState: hellgun_charge
    steps: 5
    zeroVisible: false
