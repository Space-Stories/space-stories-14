- type: entity
  parent: BaseItem
  id: STAmmoBox585Trappiste
  name: ammo box (.585 Trappiste lethal)
  description: A box of .585 Trappiste pistol rounds, holds thirty-two cartridges.
  components:
  - type: Sprite
    sprite: _Stories/Objects/Weapons/Guns/Ammunition/Boxes/585trappiste_boxes.rsi
    layers:
    - state: 585box
      map: ["enum.GunVisualLayers.Base"]
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: BallisticAmmoProvider
    mayTransfer: true
    proto: STCartridge585Trappiste
    capacity: 32
    whitelist:
      tags:
      - STCartridge585Trappiste

