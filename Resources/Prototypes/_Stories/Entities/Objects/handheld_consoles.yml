- type: entity
  abstract: true
  name: portable shuttle console
  description: Used to control the shuttle from a distance.
  suffix: DO NOT MAP
  parent:
  - BaseItem
  - PowerCellSlotSmallItem
  id: STBaseHandheldShuttleConsole
  components:
  - type: ItemToggle
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: ExtensionCableReceiver
  - type: ShuttleConsole
  - type: ActivatableUI
    inHandsOnly: true
    singleUser: true
    key: enum.ShuttleConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.ShuttleConsoleUiKey.Key:
        type: ShuttleConsoleBoundUserInterface
  - type: RadarConsole
    maxRange: 256
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
      disk_slot: !type:ContainerSlot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellSmall
      disk_slot:
        name: Disk
        insertSound:
          path: /Audio/Machines/terminal_insert_disc.ogg
        ejectSound:
          path: /Audio/Machines/terminal_insert_disc.ogg
        whitelist:
          components:
          - ShuttleDestinationCoordinates
  - type: PowerCellDraw
    drawRate: 0
    useCharge: 20
  - type: ActivatableUIRequiresPowerCell
  - type: StaticPrice
    price: 500
  - type: Tag
    tags:
    - HighRiskItem

- type: entity
  name: prison portable shuttle console
  description: Used to control the shuttle from a distance.
  suffix: DON'T MAP
  parent: STBaseHandheldShuttleConsole
  id: STPRISONHandheldShuttleConsole
  components:
  - type: DroneConsole
    components:
      - type: PrisonShuttle
  - type: Sprite
    sprite: _Stories/Objects/Devices/handheld_console.rsi
    state: shuttle_sp

- type: entity
  parent: BaseItem
  id: STHandheldStationsControlConsole
  categories: [ DoNotMap ]
  name: asset control tablet
  description: Allows for the control of any corporate asset.
  suffix: DON'T MAP
  components:
  - type: Sprite
    sprite: Objects/Misc/qm_clipboard.rsi
    layers:
    - state: qm_clipboard
    - state: qm_clipboard_over
  - type: Item
    sprite: Objects/Misc/qm_clipboard.rsi
    size: Normal
  - type: UserInterface
    interfaces:
      enum.StationsControlConsoleUiKey.Key:
        type: StationsControlConsoleBoundUserInterface
#      enum.AlertLevelTabletUiKey.Orders:
#        type: CargoOrderConsoleBoundUserInterface
  - type: ActivatableUI
    key: enum.StationsControlConsoleUiKey.Key
  - type: StationsControlConsole
