- type: entity
  parent: BaseBorgModule
  id: STBaseBorgModuleSecurity
  abstract: true
  components:
  - type: BorgModule
    borgFitTypes:
    - stories-borg-type-security
  - type: Tag
    tags:
    - STBorgModuleSecurity
  - type: Item
    inhandVisuals:
      left:
      - state: base-icon-inhand-left
        color: "#E23E3E"
      - state: base-module-inhand-left
        color: "#991F1F"
      - state: base-part-inhand-left
      - state: base-stripes-inhand-left
        color: "#C3C3C3"
      right:
      - state: base-icon-inhand-right
        color: "#E23E3E"
      - state: base-module-inhand-right
        color: "#991F1F"
      - state: base-part-inhand-right
      - state: base-stripes-inhand-right
        color: "#C3C3C3"

- type: entity
  parent: Stunbaton
  id: STStunbatonBorg
  name: cyborg stun baton
  description: A stun baton integrated with a self-recharging capacitor for cyborg usage.
  suffix: Borg
  components:
  - type: BatterySelfRecharger
    autoRechargeRate: 15

- type: entity
  parent: WeaponDisabler
  id: STWeaponDisablerBorg
  name: cyborg disabler
  description: An integrated energy disabler gun that slowly regenerates charge from the cyborg's power system.
  suffix: Borg
  components:
  - type: BatterySelfRecharger
    autoRechargeRate: 15
  - type: BatteryAmmoProvider
    proto: BulletDisabler
    fireCost: 50

- type: entity
  parent: Flash
  id: STFlashBorg
  name: cyborg flash
  description: A high-output optical flash unit modified for sustained cyborg use.
  suffix: Borg
  components:
  - type: LimitedCharges
    maxCharges: 10

- type: entity
  parent: HoloprojectorSecurity
  id: STHoloprojectorSecurityBorg
  name: cyborg holobarrier projector
  description: Creates a solid but fragile holographic barrier. It automatically recharges from the cyborg's power system.
  suffix: Borg
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
        disableEject: true
        swap: false
  - type: BatterySelfRecharger
    autoRechargeRate: 5

- type: entity
  parent: WeaponLaserGun
  id: STWeaponLaserGunBorg
  name: cyborg laser gun
  description: A modified laser gun that draws power directly from internal capacitor banks.
  suffix: Borg
  components:
  - type: BatterySelfRecharger
    autoRechargeRate: 20

- type: entity
  parent: [ STBaseBorgModuleSecurity, BaseProviderBorgModule ]
  id: STBorgModuleSecurityNonLethal
  name: non-lethal security cyborg module
  description: A security module containing a disabler, stun baton, flash, zipties, and a security whistle.
  components:
  - type: Sprite
    layers:
    - state: security
    - state: icon-xenoborg-cloak2
  - type: ItemBorgModule
    hands:
    - item: STWeaponDisablerBorg
    - item: STStunbatonBorg
    - item: STFlashBorg
    - item: Zipties
      forceRemovable: true
      hand:
        emptyRepresentative: Zipties
        emptyLabel: stories-borg-slot-zipties-empty
        whitelist:
          tags:
          - Handcuffs
    - item: STHoloprojectorSecurityBorg
    - item: SecurityWhistle
  - type: BorgModuleIcon
    icon: { sprite: _Stories/Interface/Actions/actions_borg.rsi, state: security-arest-module }

- type: entity
  parent: [ STBaseBorgModuleSecurity, BaseProviderBorgModule, BaseSecurityContraband ]
  id: STBorgModuleSecurityServiceWeapon
  name: service weapon security cyborg module
  components:
  - type: Sprite
    layers: 
    - state: security
    - sprite: _Stories/Objects/Specific/Robotics/borgmodule.rsi
      state: icon-pistol
  - type: ItemBorgModule
    hands:
    - item: WeaponPistolMk58
    - item: MagazinePistol
      forceRemovable: true
      hand:
        emptyRepresentative: MagazinePistol
        emptyLabel: stories-borg-slot-magazine-empty
        whitelist:
          tags:
          - MagazinePistol
    - item: CombatKnife
  - type: BorgModuleIcon
    icon: { sprite: _Stories/Interface/Actions/actions_borg.rsi, state: security-service-weapon-module }

- type: entity
  parent: [ STBaseBorgModuleSecurity, BaseProviderBorgModule, BaseSecurityContraband ]
  id: STBorgModuleSecurityLaser
  name: overload laser cyborg module
  description: A legal security upgrade module providing a lethal laser weapon.
  components:
  - type: Sprite
    layers:
    - state: security
    - state: icon-xenoborg-laser2
  - type: ItemBorgModule
    hands:
    - item: STWeaponLaserGunBorg
  - type: BorgModuleIcon
    icon: { sprite: _Stories/Interface/Actions/actions_borg.rsi, state: security-weapon-module }
