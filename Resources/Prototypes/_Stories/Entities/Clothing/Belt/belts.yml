- type: entity
  parent: ClothingBeltStorageBase
  id: STClothingBeltGuardian
  name: jedi belt
  description: Hang your sword on it.
  components:
    - type: Tag
      tags:
        - STForceRecallEquipment
    - type: Sprite
      sprite: _Stories/Clothing/Belt/guardian_belt.rsi
      state: icon
    - type: Clothing
      sprite: _Stories/Clothing/Belt/guardian_belt.rsi
    - type: Storage
      whitelist:
        tags:
          - CigPack
          - Radio
        components:
          - FlashOnTrigger
          - Flash
          - Welder
          - Flash
          - Handcuff
          - EnergySword

- type: entity
  parent: ClothingBeltSheath
  id: STClothingBeltSheathExe
  name: sheath for energy rapier
  description: An ornate sheath designed to hold a blade.
  components:
    - type: Sprite
      sprite: _Stories/Clothing/Belt/e_rapier_sheath.rsi
      state: sheath
    - type: Clothing
      sprite: _Stories/Clothing/Belt/e_rapier_sheath.rsi
    - type: ItemSlots
      slots:
        item:
          name: Sabre
          insertVerbText: sheath-insert-verb
          ejectVerbText: sheath-eject-verb
          whitelist:
            components:
              - Lightsaber
    - type: ItemMapper
      mapLayers:
        sheath-sabre:
          whitelist:
            components:
              - Lightsaber

- type: entity
  parent: ClothingBeltStorageBase
  id: STClothingBeltAssaultBlueshield
  name: blueshield assault belt
  description: A tactical assault belt issued to Blueshield Officers.
  components:
  - type: Sprite
    sprite: _Stories/Clothing/Belt/assault_belt.rsi
  - type: Clothing
    sprite: _Stories/Clothing/Belt/assault_belt.rsi
  - type: StorageFill
    contents:
    - id: GrenadeFlashBang
      amount: 2
    - id: STWeaponSprayPepper
    - id: Handcuffs
    - id: Flash
    - id: STWeaponTelescopicBaton
    - id: STDeathRattleImplanterSecurity
    - id: STDeathRattleImplanterSecurity
