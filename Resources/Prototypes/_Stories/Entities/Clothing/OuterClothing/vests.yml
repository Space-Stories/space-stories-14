- type: entity
  parent: ClothingOuterArmorBasic
  id: STClothingOuterVestGuardianNt
  name: blade guardian's insulated armor vest
  description: Because someone said body armor could be insulated. Your shield is already insulated!
  components:
    - type: Tag
      tags:
        - STForceRecallEquipment
        - WhitelistChameleon
    - type: TemperatureProtection
      coefficient: 0.005
    - type: StaminaResistance
      damageCoefficient: 0.70
