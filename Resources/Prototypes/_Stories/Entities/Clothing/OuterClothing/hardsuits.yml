- type: entity
  parent: [ClothingOuterHardsuitBase, BaseCentcommContraband]
  id: STClothingOuterHardsuitCentcomSecutiry
  name: centcom officer hardsuit
  description: A specialized riot suit geared to combat low pressure environments.
  components:
  - type: Sprite
    sprite: _Stories/Clothing/OuterClothing/Hardsuits/centcom_security.rsi
  - type: Clothing
    sprite: _Stories/Clothing/OuterClothing/Hardsuits/centcom_security.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.5
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.4
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.45
        Slash: 0.45
        Piercing: 0.45
        Heat: 0.8
        Caustic: 0.7
  - type: ClothingSpeedModifier
    walkModifier: 0.85
    sprintModifier: 0.85
  - type: HeldSpeedModifier
  - type: ToggleableClothing
    clothingPrototype: STClothingHeadHelmetHardsuitCentcomSecurity
  - type: BioCode
  - type: TimerTrigger
    delay: 3
  - type: ExplodeOnTrigger
    keysIn:
    - timer
  - type: Explosive
    explosionType: PowerSink
    maxIntensity: 8
    intensitySlope: 5
    totalIntensity: 5
    canCreateVacuum: false

