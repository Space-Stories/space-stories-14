- type: entity
  parent: ClothingNeckBase
  id: STClothingNeckCloakInquisitor
  name: inquisitor's cloak
  description: An incredible work of art that protects against space hardships. Charged with an unknown energy.
  components:
  - type: TemperatureProtection
    coefficient: 0.005
  - type: PressureProtection
    highPressureMultiplier: 0.02
    lowPressureMultiplier: 1000
  - type: PointLight
    color: Red
    radius: 1.5
    energy: 0.45
    softness: 3
  - type: Armor
    modifiers:
      coefficients:
        Heat: 0.4
        Radiation: 0.25
        Caustic: 0.4
  - type: Tag
    tags:
      - STForceRecallEquipment
  - type: ToggleableClothing
    clothingPrototype: STClothingHeadHatHoodInquisitor
    slot: head
    requiredSlot:
    - neck
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:ContainerSlot
  - type: Sprite
    sprite: _Stories/Clothing/Neck/Cloaks/cloak_inquisitor.rsi

