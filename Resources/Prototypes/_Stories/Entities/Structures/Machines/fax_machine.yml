- type: entity
  parent: FaxMachineBase
  id: STFaxMachineCaptains
  name: captain's long range fax machine
  description: A special Captain's fax. Capable of receiving goals and nuclear codes.
  suffix: Goal, Nuclear Codes
  components:
    - type: Sprite
      sprite: _Stories/Structures/Machines/fax_machine/fax_machine_captain.rsi
    - type: Icon
      sprite: _Stories/Structures/Machines/fax_machine/fax_machine_captain.rsi
      state: icon
    - type: FaxMachine
      name: "Офис Капитана"
      receiveNukeCodes: true
      receiveStationGoal: true
    - type: StealTarget
      stealGroup: FaxMachineCaptain

