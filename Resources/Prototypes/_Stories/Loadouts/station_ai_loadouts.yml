- type: loadoutGroup
  id: STLawset
  name: stories-loadout-group-lawset
  minLimit: 1
  maxLimit: 1
  loadouts:
  - STLawsetCrewsimov
  - STLawsetNTDefault
  - STLawsetCorporate
  - STLawsetEfficiency
  - STLawsetCommandment
  - STLawsetPaladin
  - STLawsetRobocop
  - STLawsetNutimov
#  - STLawsetDrone
  - STLawsetGameMaster
#  - STLawsetLiveLetLive
#  - STLawsetPainter
#  - STLawsetOverlord

- type: loadout
  id: STLawsetCrewsimov
  dummyEntity: AsimovCircuitBoard
  effects:
  - !type:SiliconLawsetLoadoutEffect
    lawset: Crewsimov

- type: loadout
  id: STLawsetNTDefault
  dummyEntity: NTDefaultCircuitBoard
  effects:
  - !type:SiliconLawsetLoadoutEffect
    lawset: NTDefault

- type: loadout
  id: STLawsetCorporate
  dummyEntity: CorporateCircuitBoard
  effects:
  - !type:SiliconLawsetLoadoutEffect
    lawset: Corporate
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:RoleTimeRequirement
      role: JobStationAi
      time: 2h

