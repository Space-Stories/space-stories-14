- type: loadoutGroup
  id: STLawset
  name: stories-loadout-group-lawset
  minLimit: 1
  maxLimit: 1
  loadouts:
  - STLawsetNTDefault
  - STLawsetCrewsimov
  - STLawsetCorporate
  - STLawsetEfficiency
  - STLawsetCommandment
  - STLawsetPaladin
  - STLawsetRobocop
  - STLawsetNutimov
  - STLawsetLiveLetLive
  - STLawsetGameMaster
  - STLawsetPainter

- type: loadout
  id: STLawsetNTDefault
  dummyEntity: NTDefaultCircuitBoard
  siliconLawset: NTDefault

- type: loadout
  id: STLawsetCrewsimov
