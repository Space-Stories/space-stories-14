  - STBrigmedicBeret
  - MedicalBeret
  - MedicalHeadMirror

- type: loadoutGroup
  id: STBrigmedicJumpsuit
  name: loadout-group-STBrigmedicHead-jumpsuits
  loadouts:
  - STBrigmedicJumpsuit
  - STBrigmedicJumpskirt

- type: loadoutGroup
  id: STBrigmedicBackpack
  name: loadout-group-STBrigmedicHead-backpack
  loadouts:
  - STClothingBackpackHandbagAdidos
  - STClothingBackpackHandbagBluesky
  - STClothingBackpackHandbagEight
  - STClothingBackpackHandbagGachi
  - STClothingBackpackHandbagRl
  - STClothingBackpackAdidos
  - STClothingBackpackBluesky
  - STClothingBackpackEight
  - STClothingBackpackGachi
  - STClothingBackpackRl
  - STClothingBackpackDuffelAdidos
  - STClothingBackpackDuffelBluesky
  - STClothingBackpackDuffelEight
  - STClothingBackpackDuffelGachi
  - STClothingBackpackDuffelRl
  - STClothingBackpackSatchelAdidos
  - STClothingBackpackSatchelBluesky
  - STClothingBackpackSatchelEight
  - STClothingBackpackSatchelGachi
  - STClothingBackpackSatchelRl
  - STBrigmedicBackpack
  - STBrigmedicSatchel
  - STBrigmedicDuffel

- type: loadoutGroup
  id: STSurvivalBrigmedic
  name: loadout-group-STSurvivalBrigmedic
  minLimit: 2
  hidden: true
  loadouts:
  - STEmergencyNitrogenBrigmedic
  - STEmergencyOxygenBrigmedic
  - LoadoutSpeciesVoxNitrogen

- type: loadout
  id: STBrigmedicBeret
  equipment:
    head: ClothingHeadHatBeretBrigmedic

- type: loadout
  id: STBrigmedicJumpsuit
  equipment:
    jumpsuit: ClothingUniformJumpsuitBrigmedic

- type: loadout
  id: STBrigmedicJumpskirt
  equipment:
    jumpsuit: ClothingUniformJumpskirtBrigmedic

- type: loadout
  id: STBrigmedicBackpack
  equipment:
    back: ClothingBackpackBrigmedic

- type: loadout
  id: STBrigmedicSatchel
  equipment:
    back: ClothingBackpackSatchelBrigmedic

- type: loadout
  id: STBrigmedicDuffel
  equipment:
    back: ClothingBackpackDuffelBrigmedic

- type: loadout
  id: STEmergencyNitrogenBrigmedic
  effects:
  - !type:GroupLoadoutEffect
    proto: NitrogenBreather
  storage:
    back:
    - STBoxSurvivalBrigmedicNitrogen

- type: entity
  parent: BoxCardboard
  id: STBoxSurvivalBrigmedicNitrogen
  name: survival box brigmedic
  description: It's a box with basic internals inside.
  suffix: Brigmedic N2
  components:
  - type: StorageFill
    contents:
    - id: ClothingMaskBreathMedicalSecurity
    - id: EmergencyNitrogenTankFilled
    - id: EmergencyMedipen
    - id: Flare
    - id: FoodSnackNutribrick
    - id: DrinkWaterBottleFull
  - type: Sprite
    layers:
    - state: internals
    - state: emergencytank

- type: loadout
  id: STEmergencyOxygenBrigmedic
  effects:
  - !type:GroupLoadoutEffect
    proto: OxygenBreather
  storage:
    back:
    - STBoxSurvivalBrigmedic

- type: entity
  parent: BoxCardboard
  id: STBoxSurvivalBrigmedic
  name: survival box brigmedic
  description: It's a box with basic internals inside.
  suffix: Brigmedic
  components:
  - type: StorageFill
    contents:
    - id: ClothingMaskBreathMedicalSecurity
    - id: EmergencyOxygenTankFilled
    - id: EmergencyMedipen
    - id: Flare
    - id: FoodSnackNutribrick
    - id: DrinkWaterBottleFull
  - type: Sprite
    layers:
    - state: internals
    - state: emergencytank
